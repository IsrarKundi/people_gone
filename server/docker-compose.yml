version: "3.8"

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: peoplegone-worker
    environment:
      - RUNPOD_DEBUG_LEVEL=DEBUG
      - CLIPDROP_API_KEY=${CLIPDROP_API_KEY:-}
    volumes:
      - ./worker:/app/worker
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["python", "-u", "cli.py", "--help"]
