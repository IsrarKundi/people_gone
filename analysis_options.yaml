# PeopleGone analyzer options: flutter_lints + strict language modes
# (FOLDER_STRUCTURE_AND_CONVENTIONS.md §9). `flutter analyze` must be clean.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Project-wide style rules beyond flutter_lints.
    prefer_single_quotes: true
    require_trailing_commas: true
