name: people_gone
description: "uncrowd — remove background people from your photos. Your subject stays untouched."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  dio: ^5.9.0
  intl: ^0.20.2
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  share_plus: ^10.1.4
  url_launcher: ^6.3.2
  gal: ^2.3.2
  flutter_svg: ^2.3.0
  phosphoricons_flutter: ^1.1.1
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon2.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B54EF"
  adaptive_icon_foreground: "assets/images/icon2.png"

